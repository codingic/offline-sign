# 独立 crate（**不在** allchain-rust-sdk workspace 内），故所有依赖必须写显式版本，
# 不能用 `workspace = true` 继承——离开 workspace 后 cargo 找不到可继承的 [workspace] 根。
[package]
name = "sign"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Offline signer: local HTTP service that holds two password-encrypted keystores (secp256k1 + ed25519) and signs/assembles transactions (signtx) for eth / btc / sol / near / apt / sui / ton / icp"

[[bin]]
name = "sign"
path = "src/main.rs"

[dependencies]
# 统一信封 / 错误码，与 acli 三形态保持一致。
# 以相对路径引用 SDK 的 core（core 自身仍属 allchain-rust-sdk workspace，
# 其 workspace 继承由 cargo 沿 core/ 向上找到该 workspace 根来解析，可正常工作）。
allchain-core = { path = "../allchain-rust-sdk/core" }
# HTTP 框架沿用 acli 的 axum 0.8。
axum = "0.8"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
hex = "0.4.3"
base64 = "0.22"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
# 密钥生成。
rand = "0.8"
# ETH：secp256k1 可恢复签名 + RLP 交易组装（alloy 已含 keccak256 / k256）。
k256 = { version = "0.13", features = ["ecdsa"] }
alloy = { version = "2.1.1", features = ["full"] }
# BTC：交易反序列化、BIP143 / 传统 sighash、紧凑签名（`r || s`）。
#
# 版本必须与 allchain-rust-sdk 的 `chain/btc` **逐位一致**：sighash 是签名的输入，
# 两侧一旦因版本漂移算出不同结果，签名会被节点拒绝，而本地签名/验签全都正常——
# 这类缺陷在广播前不会报任何错。
bitcoin = "0.32"
# ed25519 链（SOL/NEAR/APT/SUI/TON）统一用 ed25519-dalek 做签名/验签。
ed25519-dalek = "2.2"
# 地址派生所需哈希原语（APT 用 sha3-256，SUI 用 blake2b-256）。
sha3 = "0.10"
blake2 = "0.10"
# ICP：self-authenticating principal 派生（SHA-224 做摘要；CRC-32 做校验和）。
# base32 用本文件内手写的 RFC4648 实现（无填充），不引第三方 crate。
sha2 = "0.10"
crc32fast = "1"
# SOL：交易反序列化 + 签名装配。
#
# 注意 `wincode` 这个 feature：**必须开**。`Message::serialize()`（真正的待签线格式）
# 就门控在它后面，不开则编译期直接没有这个方法；而少了它，就只剩 serde/bincode 编码，
# 那种编码签出来的交易会被节点拒绝。
solana-message = { version = "4.4.1", features = ["serde", "wincode"] }
solana-pubkey = "4.2.1"
solana-signature = "3.4.1"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.6", features = ["serde", "wincode"] }
solana-keypair = "3.1.2"
bincode = "1.3"
# NEAR：borsh 交易序列化（near-primitives 锁定 borsh 0.9）。
near-crypto = "0.37"
near-primitives = "0.37"
borsh = { version = "1.0", features = ["derive"] }
# APT：RawTransaction / SignedTransaction（BCS）。
aptos-sdk = "0.4.1"
bcs = "0.1.6"
# SUI：Transaction / SignedTransaction / intent 前缀（BCS）。
sui-sdk-types = { version = "=0.0.7", features = ["serde"] }
# TON：ed25519 签名（external message 组装需钱包 code/state-init，本服务仅出签名）。
tonlib-core = "0.26"
num-bigint = "0.4"
# —— 加密 keystore ——
# Argon2id：口令派生密钥。选 id 变体（而非 i 或 d）是为了同时抗 GPU 侧信道与时空权衡攻击。
argon2 = "0.5"
# AES-256-GCM：私钥加密。用 AEAD 而非 AES-CTR + 自拼 MAC——手拼 MAC 最容易漏绑定
# 某个字段（长度、IV、版本），漏一个就等于整段认证形同虚设。
aes-gcm = "0.10"
# 终端读口令（关闭回显）；跨平台处理了 Windows console 与 Unix termios。
rpassword = "7"
# 口令与派生密钥用完即清零，避免明文长期驻留堆上被 core dump / swap 捞走。
zeroize = "1"
# 校验值比对走恒定时间：`==` 会按字节短路，泄露「前几位猜对了」。
subtle = "2"
# keystore 错误类型：必须能在类型层面区分「口令错」与「文件损坏」，
# 因为两者处置方式完全相反（重试 vs 恢复备份）。
thiserror = "2"

[dev-dependencies]
# 仅测试用：构造一条真实的 SystemProgram.transfer 指令，
# 以便对比「线格式」与「bincode 格式」的差异（见 src/sign/sol.rs 的测试）。
# `wincode` 必须开：`transfer()` 构造器被门控在 bincode/wincode 之后，
# 不开则整个函数不存在。
solana-system-interface = { version = "3.2.0", features = ["wincode"] }
